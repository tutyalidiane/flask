{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 mb-0">{% block title %}Novo post{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-8 col-lg-6">
    <form method="post" enctype="multipart/form-data" class="card shadow-sm p-4">
      <div class="mb-3">
        <label for="title" class="form-label">Título</label>
        <input name="title" id="title" class="form-control" value="{{ request.form['title'] }}" required>
      </div>
      <div class="mb-3">
        <label for="body" class="form-label">Texto</label>
        <textarea name="body" id="body" rows="5" class="form-control">{{ request.form['body'] }}</textarea>
      </div>
      <div class="mb-3">
        <label for="imagem" class="form-label">Imagem do post</label>
        <input type="file" name="imagem" id="imagem" class="form-control" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
  </div>
</div>
{% endblock %}
